<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARL · Linux 服务设置</title><link rel="stylesheet" href="/settings.css"></head><body><main><header><p class="eyebrow">ARL / LINUX</p><h1>服务设置</h1><p>管理这台电脑上的服务连接和应用授权。</p><p id="demo" hidden>示例配置 · 未连接真实账号或设备</p></header><p id="notice" role="status" aria-live="polite">正在读取本机配置…</p><div id="services" class="grid"></div><section><h2>AI 任务</h2><p>使用已安装并登录的 Codex CLI。保存配置不登录、不提交任务；更新后需重启 ARL 宿主。</p><form id="models"><label>CLI 绝对路径<input name="binary" required autocomplete="off"></label><label>已核对的 SHA-256<input name="sha256" required pattern="[a-f0-9]{64}" autocomplete="off"></label><label>可用模型 ID<input name="model" required></label><label>调用上限<input name="max_calls" type="number" min="1" max="1000" value="100" required></label><button>保存模型设置</button><button type="button" id="disable-models" class="secondary">停用模型服务</button></form><form id="scheduler"><label>同时处理的任务数<input name="max_parallel" type="number" min="1" max="8" value="2" required></label><button>保存并行数</button></form></section><section><h2>任务档位</h2><p>宿主取得模型目录后，可调整五个任务档位。修改档位不提交模型任务。</p><form id="packages"><div id="package-rows"></div><button id="save-packages" disabled>保存任务档位</button></form></section><section><h2>Apple 服务</h2><p>Linux 不支持 Apple 日历、提醒事项、信息、备忘录和钥匙串。</p><span class="badge">不支持</span></section><footer>凭据保存在当前账号私有文件中，不使用 macOS 钥匙串。配置仅允许本机访问；关闭设置进程后，本次页面令牌失效。</footer></main><script src="/settings.js" defer></script></body></html>
