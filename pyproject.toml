[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arl-runtime"
version = "0.1.2"
description = "Local, headless Agent Runtime Layer"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
arl = "arl.__main__:main"

[tool.setuptools.packages.find]
include = ["arl*"]

[project.optional-dependencies]
linux = ["cryptography==50.0.2"]

[tool.setuptools.package-data]
arl = ["static/linux_settings.html", "static/linux_settings.css", "static/linux_settings.js", "static/mio-tools.json", "static/service-connections.json"]
